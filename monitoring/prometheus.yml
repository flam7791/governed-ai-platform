# Prometheus scrapes the gateway and the agents service inside the platform network.
# The scrape tokens reach Prometheus as Compose secrets (files), never in this file.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/gateway_metrics_token
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: agents
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/agents_metrics_token
    static_configs:
      - targets: ["agents:8090"]
