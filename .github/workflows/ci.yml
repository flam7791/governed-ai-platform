name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly, to catch drift in base images and dependencies
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: platform

      - name: Read the pinned component versions
        run: grep -v '^#' platform/components.env | grep . >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.GATEWAY_REPO }}
          ref: ${{ env.GATEWAY_REF }}
          path: governed-llm-gateway
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.EVIDENCE_REPO }}
          ref: ${{ env.EVIDENCE_REF }}
          path: policy-evidence-mcp
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.AGENTS_REPO }}
          ref: ${{ env.AGENTS_REF }}
          path: governed-agents

      - name: Lint the scripts
        working-directory: platform
        run: |
          pipx run ruff check .
          pipx run ruff format --check .

      - name: Install kustomize and kubeconform
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin kustomize
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | sudo tar xz -C /usr/local/bin kubeconform

      - name: Configuration invariants (sovereign has no route out; Kubernetes hardening)
        working-directory: platform
        run: |
          pip install pytest pyyaml
          pytest -q tests

      - name: Kubernetes manifests render and validate against the API schemas
        working-directory: platform
        run: |
          python scripts/new_env.py --demo --kubernetes --force
          python scripts/new_env.py --kubernetes --force
          python scripts/new_env.py --sovereign --kubernetes --force
          for overlay in demo live sovereign; do
            kustomize build deploy/kubernetes/overlays/$overlay \
              | kubeconform -strict -summary -kubernetes-version 1.33.0 -
          done

      - name: Configuration and alert rules are valid
        working-directory: platform
        run: |
          python scripts/new_env.py --demo
          docker compose --profile demo --profile monitoring config -q
          python scripts/new_env.py --sovereign --force
          docker compose --profile sovereign config -q
          python scripts/new_env.py --demo --tracing --force
          docker run --rm -v "$PWD/monitoring:/m:ro" --entrypoint promtool \
            prom/prometheus:v3.15.0 check rules /m/alerts.yml

      - name: Build and start the stack (demonstration model, no keys, with tracing)
        working-directory: platform
        run: docker compose --profile demo --profile tracing up -d --build --wait

      - name: End-to-end smoke test (including one trace across the three services)
        working-directory: platform
        run: python scripts/smoke_test.py

      - name: Logs
        if: always()
        working-directory: platform
        run: docker compose --profile demo --profile tracing logs --no-color

      - name: Stop and remove
        if: always()
        working-directory: platform
        run: docker compose --profile demo --profile tracing down -v
